# The Decision Code – Netlify config
# Deploy: connect repo to Netlify; build command and publish dir below serve the assessment + API.

[build]
  # No build step – static HTML/CSS/JS
  publish = "."
  # Functions live in netlify/functions/ and are served at /.netlify/functions/<name>

# Redirect root to assessment (optional – remove if you use / as landing)
[[redirects]]
  from = "/"
  to = "/decision-code/"
  status = 302

# Redirect old readiness-check URL to decision-code (keeps quiz.mistylavertu.com/readiness-check/ working)
[[redirects]]
  from = "/readiness-check/"
  to = "/decision-code/"
  status = 302
[[redirects]]
  from = "/readiness-check/*"
  to = "/decision-code/:splat"
  status = 302

# SPA-style fallback for assessment if you add client-side routing later (optional)
# [[redirects]]
#   from = "/decision-code/*"
#   to = "/decision-code/index.html"
#   status = 200
